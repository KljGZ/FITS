[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfits"
version = "0.1.0"
description = "Reproducible infrastructure for software-noise-calibrated generator attribution"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "matplotlib==3.9.2",
  "numpy==1.26.4",
  "Pillow==11.0.0",
  "PyWavelets==1.7.0",
  "PyYAML==6.0.2",
  "scikit-image==0.24.0",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
  "pre-commit==4.0.1",
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[project.scripts]
gfits = "gfits.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["third_party", "main.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
