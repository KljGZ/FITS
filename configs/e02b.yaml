phase: E02b
status: pre_registered
pre_registered_at_utc: "2026-08-07T12:50:39Z"
claim: controlled generator-source fingerprint confirmation; not G-FITS calibration

governance:
  require_committed_clean_tree: true
  frozen_e02_test_scores_are_audit_only: true
  method_selection_split: calibration
  confirmatory_split: test
  stage_order: [E02b, E03, E04, E05]
  code_hash_paths:
    - configs/e02b.yaml
    - src/gfits/e02.py
    - src/gfits/e02b.py
    - src/gfits/e02b_data.py
    - src/gfits/e02b_features.py
    - src/gfits/e02b_generation.py
    - src/gfits/e02b_statistics.py
    - src/gfits/explicit_scoring.py
    - src/gfits/controls.py
    - src/gfits/cli.py
    - src/gfits/matching.py
    - src/gfits/manifest.py
    - environment-e02b.yml
    - pyproject.toml
    - reports/e02b/PRO_AUDIT_TRACEABILITY.md

design:
  prompt_count: 200
  prompt_template: "a detailed photograph of {subject} {scene}, natural light, realistic texture"
  subjects:
    - a red bicycle
    - a wooden sailboat
    - a glass teapot
    - a mountain cabin
    - a yellow school bus
    - a ceramic vase
    - a tabby cat
    - a stone bridge
    - a green tractor
    - a bowl of oranges
    - an old typewriter
    - a blue umbrella
    - a lighthouse
    - a pair of hiking boots
    - a city tram
    - a violin
    - a sunflower field
    - a silver wristwatch
    - a bakery storefront
    - a red fox
  scenes:
    - beside a quiet lake
    - on a busy city street
    - inside a sunlit studio
    - beneath an overcast sky
    - at the edge of a forest
    - on a marble table
    - during golden hour
    - in a snowy landscape
    - near a brick wall
    - in a public market
  negative_prompt: "text, watermark, logo, signature, low quality"
  prompt_split_counts:
    template: 100
    calibration: 40
    test: 60
  split_rank_seed: 2026080701
  seeds:
    template: [11235813, 27182818]
    calibration: [31415926]
    test: [16180339]
  generate_complete_prompt_seed_factorial: true
  generation_batch_size: 1
  resolutions: [256, 512, 768, 1024]
  writer:
    id: canonical_png_v1
    library: Pillow
    version: 11.0.0
    color_space: RGB
    tensor_layout: HWC
    tensor_range: closed_0_1
    tensor_dtype: float32
    quantization: clip_0_1_then_rint_x255_to_uint8
    png_compress_level: 6
    png_optimize: false

model_groups:
  cross_family:
    purpose: family-level controlled signal
    models: [sd14, tiny_sd, kandinsky22, pixart_sigma]
  near_family:
    purpose: checkpoint-level controlled signal
    models: [sd14, sd15, openjourney_v4, dreamshaper8]

models:
  sd14:
    family: latent_diffusion
    base_model: CompVis/stable-diffusion-v1-4
    adapter: stable_diffusion
    weight_format: safetensors
    variant: fp16
    repositories:
      - repo_id: CompVis/stable-diffusion-v1-4
        revision: 133a221b8aa7292a167afc5127cb63fb5005638b
    checkpoint_hash: revision_inventory_sha256
    vae: integrated
    vae_hash: revision_inventory_component_sha256
    scheduler: DPMSolverMultistepScheduler
    scheduler_parameters: &dpm_solver_parameters
      algorithm_type: dpmsolver++
      solver_order: 2
      final_sigmas_type: zero
    sampler: dpm_solver_multistep
    steps: 20
    guidance_scale: 7.5
    compute_dtype: float16
    safety_filter: disabled_for_controlled_non_sensitive_prompts
  sd15:
    family: latent_diffusion
    base_model: stable-diffusion-v1-5/stable-diffusion-v1-5
    adapter: stable_diffusion
