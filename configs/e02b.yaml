residuals:
  wavelet:
    implementation: polimi-ispl/prnu-python
    commit: 91e1585a39287e26f9e770b71cf9124c35d9248d
    functions_sha256: 9c26c0c854283145218950c7a63f04ef894b7c1b735bb18249ac42d74408b45f
    levels: 4
    sigma: 5.0
  fixed_three_kernel_high_pass_residual_bank:
    implementation: gfits_fixed_three_kernel_high_pass_v2
    boundary: reflect
  low_bit:
    bit_count: 2
  noiseprint:
    commit: c06034eedc9235b642a4da9ea8ef25901d6add93
    model: net_jpg101
    quality_factor: 101
    checkpoint_sha256:
      model.data-00000-of-00001: e5b813ac87b2972991766c8a10195f464ed276593eaaf157a1bd297228ba70d6
      model.index: d28b09038156b15ed438bae3242df33c4e75b21bb79a93024a4923b7f467a77a
      model.meta: 940467a4384c0fe916829f80d83816eead5b8b951d26e06b07f54f2d8b3943d5

spatial_branch:
  extractors:
    [wavelet, fixed_three_kernel_high_pass_residual_bank, low_bit, noiseprint]
  aggregators:
    additive: [mean, median, trimmed_mean_10, standardized_mean, spectral_whitened_mean]
    multiplicative_wavelet_only: [prnu_mle]
    non_wavelet_weighted_name: intensity_weighted
  template_sizes: [1, 3, 5, 10, 20, 50]
  scorers: [raw_signed_ncc_global, raw_signed_ncc_channel_mean, raw_signed_ncc_whitened]
  secondary_scorers: [raw_signed_energy, raw_pce]
  components: [full, common, source_delta]
  native_cross_resolution_patch:
    size: 256
    positions: [center]

statistical_signature_branch:
  base_residual: fixed_three_kernel_high_pass_residual_bank
  signatures:
    - power_spectrum_2d
    - phase_spectrum
    - radial_power_spectrum
    - autocorrelation
    - cepstrum
    - srm_style_cooccurrence
    - patch_gram_covariance
    - low_high_frequency_partition
  aggregators: [mean, median]
  template_sizes: [1, 3, 5, 10, 20, 50]
  scorer: signed_ncc
  normalized_signature_grid_size: 128

multiplicative_diagnostics:
  split: calibration
  intensity_bins: 16
  tests: [binned_variance, linear_regression, breusch_pagan]
  modulation_requires_all:
    slope_positive: true
    regression_p_below: 0.05
    breusch_pagan_p_below: 0.05

counterfactuals:
  canonical_uniform_export: {kind: canonical_requantize}
  random_lsb_pm1: {kind: lsb_jitter, seed: 2026080702}
  bit_depth_6: {kind: bit_depth, bits: 6}
  png_reencode_level_9: {kind: png_reencode, compress_level: 9, optimize: false}

statistics:
  primary_split: test
  calibration_split: calibration
  bootstrap:
    kind: two_way_template_image_and_query_prompt_group
    draws: 1000
    confidence: 0.95
    seed: 2026080703
  permutations:
    prompt_block_source_label: {draws: 10000, seed: 2026080704}
    template_source_label: {draws: 10000, seed: 2026080705}
    hierarchical_family_prompt: {draws: 10000, seed: 2026080706}
    auxiliary_sign_flip: {draws: 10000, seed: 2026080707}
  multiple_testing: holm_fwer_within_pre_registered_suite_branch_families
  alpha: 0.05
  confirmatory_selection:
    split: calibration
    primary_resolution: 512
    template_size: 50
    eligible_components: [full, source_delta]
    criterion: maximum_macro_source_auroc
    tie_break: lexicographic_condition_id
  resolution_profile:
    split: calibration_then_test
    resolutions: [256, 512, 768, 1024]
    aggregator: median
    spatial_scorers: [raw_signed_ncc_global, raw_signed_ncc_channel_mean]
    statistical_scorer: signed_ncc
    components: [full, source_delta]
    gate_effect: none_descriptive_secondary_analysis
  metrics:
    - pooled_pairwise_auroc
    - macro_source_auroc
    - per_source_auroc
    - rank1
    - rank5
    - mean_average_precision
    - mean_reciprocal_rank
    - confusion_matrix
    - candidate_template_bias
    - template_number_curve

e02b_gate:
  require_cross_family_suite: true
  require_near_family_suite: true
  macro_source_auroc_bootstrap_lower_above: 0.5
  rank1_above_random_permutation_p_below: 0.05
  require_no_single_source_dominance: true
  require_stable_template_size_improvement: true
  require_low_bit_signal_after_uniform_export: true
  pass_requires_all_six: true
  decision_pass: proceed_to_e03_configuration_and_hierarchy_analysis
  decision_fail: stop_or_restrict_fixed_generator_fingerprint_mainline

claim_boundaries:
  forbidden_before_e02b_pass:
    - universal_generator_fingerprint_validated
    - different_generator_fingerprints_are_independent
    - gfits_validated
    - aigc_software_noise_removed
    - universal_aigc_detection_implemented
