aggregators:
  names: [mean, prnu_mle, median, trimmed_mean]
  trimmed_mean_fraction: 0.2
  prnu_mle_denominator_epsilon: 1.0e-8

scoring:
  primary_similarity: signed_zero_mean_ncc
  secondary_similarity: squared_ncc_energy
  control_type: other_generator_templates_same_dataset_and_native_geometry
  stabilizer: 1.0e-12

evaluation:
  primary_split: test
  calibration_use: diagnostics_only_no_method_selection
  permutation:
    kind: one_sided_paired_query_sign_flip
    draws: 20000
    seed: 20260808
  bootstrap:
    kind: query_clustered_auroc_percentile
    draws: 2000
    confidence: 0.95
    seed: 20260809
  multiple_testing: holm_fwer_across_all_registered_conditions
  alpha: 0.05
  signal_condition:
    corrected_p_below_alpha: true
    auroc_ci_lower_above_chance: true
    paired_margin_above_zero: true

completion_gate:
  expected_selected_file_count: 440
  expected_condition_count: 48
  require_all_selected_sha256: true
  require_exact_native_geometry: true
  require_no_gfits_image_transformations: true
  require_prompt_disjoint_splits: true
  require_original_disjoint_splits: true
  require_seed_metadata_and_disjoint_splits: true
  require_all_extractors: true
  require_all_aggregators: true

mainline_gate:
  required_signal_suites: [dm_256, genimage_256, genimage_512]
  minimum_passing_conditions_per_suite: 1
  decision_if_all_methods_fail: stop_gfits_generator_matching_mainline
  decision_if_metadata_gate_fails: stop_confirmatory_claim_and_require_controlled_seed_provenance

stop_rule: Results are exploratory when seed identity is unavailable; a failed metadata gate cannot be relabeled as confirmatory generator-fingerprint evidence.
